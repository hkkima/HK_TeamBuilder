<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>팀빌딩 스튜디오 · 운영진 전용</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧩</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 로그인 게이트 (ENABLE_AUTH=false 면 자동 통과) -->
  <div id="login-screen" style="display:none">
    <form id="login-form" class="login-card" autocomplete="off">
      <h1>🧩 팀빌딩 스튜디오</h1>
      <p class="sub">운영진 전용 · 공유 ID/PW가 필요합니다</p>
      <label>ID<input id="login-id" type="text" autocomplete="username" required /></label>
      <label>비밀번호<input id="login-pw" type="password" autocomplete="current-password" required /></label>
      <button type="submit">로그인</button>
      <div id="login-error" class="error"></div>
      <p class="hint">※ 정적 페이지 보호는 난독화 수준입니다. 데이터는 브라우저에서만 처리·저장됩니다.</p>
    </form>
  </div>

  <div id="app" style="display:none">
    <header class="topbar">
      <div class="brand">🧩 <b>팀빌딩 스튜디오</b></div>
      <div class="proj">
        <select id="project-select" title="프로젝트"></select>
        <button id="btn-new-proj" class="icon" title="새 프로젝트">＋</button>
        <button id="btn-rename-proj" class="icon" title="이름 변경">✎</button>
        <button id="btn-del-proj" class="icon" title="삭제">🗑</button>
      </div>
      <nav class="tabs">
        <button class="tab" data-tab="data">① 데이터</button>
        <button class="tab" data-tab="board">② 편성</button>
        <button class="tab" data-tab="compare">③ 비교</button>
      </nav>
      <div class="top-actions">
        <button id="btn-undo" class="icon" title="되돌리기 (Ctrl+Z)">↶</button>
        <button id="btn-redo" class="icon" title="다시하기 (Ctrl+Shift+Z)">↷</button>
        <span id="save-ind" class="save-ind">저장됨</span>
        <button id="btn-import-proj" class="ghost sm">가져오기</button>
        <button id="btn-export-proj" class="ghost sm">내보내기</button>
        <button id="btn-logout" class="ghost sm" style="display:none">로그아웃</button>
        <input id="file-proj" type="file" accept=".json,application/json" hidden />
      </div>
    </header>

    <main class="workspace">
      <section id="tab-data" class="tabpane"></section>
      <section id="tab-board" class="tabpane"></section>
      <section id="tab-compare" class="tabpane"></section>
    </main>

    <div id="overlay" class="overlay" style="display:none"><div class="spinner"></div><p>계산 중…</p></div>
    <div id="toast" class="toast" aria-live="polite"></div>
  </div>

  <script src="js/sample.js"></script>
  <script src="js/teambuilder.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/view-data.js"></script>
  <script src="js/view-board.js"></script>
  <script src="js/view-compare.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
